name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar modelo local YAMNet
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite \
            --output app/src/main/assets/yamnet.tflite
          test "$(wc -c < app/src/main/assets/yamnet.tflite)" -gt 1000000
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Inspeccionar manifiesto y paquete instalable
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 20
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -Fq com.despertadorflash
      - name: Verificar APK generado y firma de depuración
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DespertadorFlash-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
