name: Compilar AURORA Android 64 bits
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main, aurora-sense-precision-2026-11-10]
  pull_request:
    branches: [main, aurora-sense-precision-2026-11-10, aurora-4.34-compose-pilot, aurora-4.35-neon-experience, aurora-4.36-slim-neon]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # PR builds should record the actual feature-branch commit in MASTER,
          # not GitHub's ephemeral merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar modelo local YAMNet
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite \
            --output app/src/main/assets/yamnet.tflite
          test "$(wc -c < app/src/main/assets/yamnet.tflite)" -gt 1000000
      - name: Ejecutar pruebas Python
        run: |
          set -o pipefail
          mkdir -p build
          python3 -B -m unittest discover -s scripts/tests -p 'test_*.py' -v 2>&1 | tee build/python-tests.log
      - name: Probar Java y compilar APK ARM64 y pruebas de interfaz
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Verificar firma, contenido y ABI de la APK
        run: bash scripts/verify_delivery.sh
      - name: Generar el ZIP de entrega
        env:
          AURORA_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 -m pip install --disable-pip-version-check 'reportlab>=4,<5'
          python3 scripts/build_delivery.py --branch "$AURORA_BRANCH"
      - uses: actions/upload-artifact@v4
        with:
          name: AURORA-4.37-GLOBAL-CLEAN-NEON-ARM64
          path: dist/AURORA_4_37_GLOBAL_CLEAN_NEON_ARM64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
