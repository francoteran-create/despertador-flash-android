name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main, aurora-sense-precision-2026-11-10]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Preparar modelo local YAMNet
        run: |
          mkdir -p app/src/main/assets
          curl --fail --location --retry 3 --silent --show-error \
            https://storage.googleapis.com/mediapipe-models/audio_classifier/yamnet/float32/1/yamnet.tflite \
            --output app/src/main/assets/yamnet.tflite
          test "$(wc -c < app/src/main/assets/yamnet.tflite)" -gt 1000000
      - name: Probar resumen de validaciones voluntarias
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Probar clasificación y reglas de alertas
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Inspeccionar APKs según procesador
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 2
          for apk in "${apks[@]}"; do
            echo "Archivo: $apk"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 12
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -Fq com.despertadorflash
          done
      - name: Verificar firmas y tamaños de las dos APKs
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            test -s "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
            sha256sum "$apk"
            du -h "$apk"
          done
      # La entrega manual construye un unico ZIP: APKs, fuentes completas,
      # modelo YAMNet, informe PDF y MANIFEST de hashes/estado.
      - name: Verificar armado de ZIP MASTER y PDF de continuidad
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: |
          python3 -m pip install --disable-pip-version-check 'reportlab>=4,<5'
          python3 scripts/build_master.py
          unzip -t dist/AURORA_MASTER_INTEGRAL_*.zip | tail -n 2
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: AURORA-MASTER-INTEGRAL
          path: dist/AURORA_MASTER_INTEGRAL_*.zip
          if-no-files-found: error
