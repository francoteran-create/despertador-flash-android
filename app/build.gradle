plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'org.jetbrains.kotlin.plugin.compose'
}
android {
 namespace 'com.despertadorflash'
 compileSdk 35
 buildFeatures { compose true }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
 defaultConfig { applicationId 'com.despertadorflash'; minSdk 24; targetSdk 35; versionCode 77; versionName '4.37-global-clean-neon-beta'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 // Debug beta deliberately coexists with stable AURORA: never overwrite the
 // stable user installation. Keep beta427 suffix to preserve beta settings on upgrade.
 buildTypes {
  debug {
   applicationIdSuffix '.beta427'
   resValue 'string', 'app_name', 'AURORA 4.37 BETA'
  }
  release {
   resValue 'string', 'app_name', 'AURORA'
  }
 }
 // Only one delivery APK, 64-bit ARM for the Galaxy S9+.
 // Other architectures remain outside the agreed user delivery.
 splits {
  abi {
   enable true
   reset()
   include 'arm64-v8a'
   universalApk false
  }
 }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
 implementation platform('androidx.compose:compose-bom:2025.02.00')
 implementation 'androidx.activity:activity-compose:1.10.0'
 implementation 'androidx.compose.material3:material3'
 androidTestImplementation platform('androidx.compose:compose-bom:2025.02.00')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 implementation 'com.google.mediapipe:tasks-audio:1.2.2'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'com.google.mlkit:image-labeling:17.0.9'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'androidx.documentfile:documentfile:1.0.1'
 implementation 'androidx.core:core:1.13.1'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 testImplementation 'junit:junit:4.13.2'
}
