plugins { id 'com.android.application' }
android {
 namespace 'com.despertadorflash'
 compileSdk 35
 defaultConfig { applicationId 'com.despertadorflash'; minSdk 24; targetSdk 35; versionCode 42; versionName '4.2-sense-backup-beta' }
 // Debug beta deliberately coexists with stable AURORA: never overwrite the
 // existing user installation or its private data because of a debug key.
 buildTypes {
  debug {
   applicationIdSuffix '.beta'
   resValue 'string', 'app_name', 'AURORA BETA'
  }
  release {
   resValue 'string', 'app_name', 'AURORA'
  }
 }
 // Deliver only the native libraries required by each real Android CPU.
 // No emulators/Intel libraries and no duplicate ARM architectures per APK.
 splits {
  abi {
   enable true
   reset()
   include 'arm64-v8a', 'armeabi-v7a'
   universalApk false
  }
 }
}
dependencies {
 implementation 'com.google.mediapipe:tasks-audio:1.2.2'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'com.google.mlkit:image-labeling:17.0.9'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'androidx.documentfile:documentfile:1.0.1'
 implementation 'androidx.core:core:1.13.1'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 testImplementation 'junit:junit:4.13.2'
}
