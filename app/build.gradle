plugins { id 'com.android.application' }
android {
 namespace 'com.despertadorflash'
 compileSdk 35
 defaultConfig { applicationId 'com.despertadorflash'; minSdk 24; targetSdk 35; versionCode 48; versionName '4.8-bilingual-queue-beta' }
 // Debug beta deliberately coexists with stable AURORA: never overwrite the
 // existing user installation or its private data because of a debug key.
 buildTypes {
  debug {
   applicationIdSuffix '.beta48'
   resValue 'string', 'app_name', 'AURORA 4.8 BETA'
  }
  release {
   resValue 'string', 'app_name', 'AURORA'
  }
 }
 // Only one delivery APK, 64-bit ARM for the Galaxy S9+.
 // Other architectures remain outside the agreed user delivery.
 splits {
  abi {
   enable true
   reset()
   include 'arm64-v8a'
   universalApk false
  }
 }
}
dependencies {
 implementation 'com.google.mediapipe:tasks-audio:1.2.2'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'com.google.mlkit:image-labeling:17.0.9'
 implementation 'com.google.mlkit:text-recognition:16.0.1'
 implementation 'androidx.documentfile:documentfile:1.0.1'
 implementation 'androidx.core:core:1.13.1'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 testImplementation 'junit:junit:4.13.2'
}
