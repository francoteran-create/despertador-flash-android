plugins { id 'com.android.application' }
android {
 namespace 'com.despertadorflash'
 compileSdk 35
 defaultConfig { applicationId 'com.despertadorflash'; minSdk 24; targetSdk 35; versionCode 35; versionName '3.5' }
 // Deliver only the native libraries required by each real Android CPU.
 // No emulators/Intel libraries and no duplicate ARM architectures per APK.
 splits {
  abi {
   enable true
   reset()
   include 'arm64-v8a', 'armeabi-v7a'
   universalApk false
  }
 }
}
dependencies {
 implementation 'com.google.mediapipe:tasks-audio:1.2.2'
 implementation 'com.google.mlkit:translate:17.0.3'
 implementation 'androidx.documentfile:documentfile:1.0.1'
 testImplementation 'junit:junit:4.13.2'
}
